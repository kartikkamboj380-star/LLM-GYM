name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q app tests run.py
      - name: Run offline unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      # No provider secrets are needed: external API calls are mocked.

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional browser test dependencies
        run: |
          python -m pip install -r requirements-automation.txt
          python -m playwright install --with-deps chromium
      - name: Run authorized local registration browser flows
        run: |
          set -e
          for flow in local-demo-e2e local-demo-invalid-retry-e2e local-demo-expired-e2e local-demo-timeout-e2e; do
            python -m app.automation.local_e2e "examples/${flow}.json"
          done
      # This job is required to execute, not skip, all four real Chromium flows.
